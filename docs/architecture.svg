<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="1280" height="740" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Mirror Tutor architecture</title>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8325b"/></marker>
</defs>
<rect width="1280" height="740" fill="#ffffff"/>
<text x="40" y="44" font-size="26" font-weight="700" fill="#1f2328">Mirror Tutor architecture</text>
<text x="40" y="68" font-size="14" fill="#59636e">Browser, Next.js API routes (in-memory only) and external services. Pink arrows carry data that leaves the device.</text>
<rect x="30" y="90" width="340" height="558" rx="14" fill="#f6f8fa" stroke="#c9d1d9"/>
<text x="48" y="116" font-size="15" font-weight="700" fill="#1f2328">Browser (user's device)</text>
<rect x="480" y="90" width="340" height="558" rx="14" fill="#f6f8fa" stroke="#c9d1d9"/>
<text x="498" y="116" font-size="15" font-weight="700" fill="#1f2328">Next.js API routes (Vercel)</text>
<rect x="930" y="90" width="320" height="558" rx="14" fill="#f6f8fa" stroke="#c9d1d9"/>
<text x="948" y="116" font-size="15" font-weight="700" fill="#1f2328">External services</text>
<rect x="50" y="130" width="300" height="76" rx="10" fill="#ffffff" stroke="#c9d1d9"/>
<text x="64" y="157" font-size="15" font-weight="600" fill="#1f2328">Capture + quality gate</text>
<text x="64" y="177" font-size="13" fill="#59636e">Canvas: face width, light, frontal</text>
<text x="64" y="194" font-size="13" fill="#59636e">Long side 1600 px, JPEG</text>
<rect x="50" y="230" width="300" height="76" rx="10" fill="#ffffff" stroke="#c9d1d9"/>
<text x="64" y="257" font-size="15" font-weight="600" fill="#1f2328">localStorage</text>
<text x="64" y="277" font-size="13" fill="#59636e">5 face attributes only</text>
<text x="64" y="294" font-size="13" fill="#59636e">Deletable profile</text>
<rect x="50" y="330" width="300" height="76" rx="10" fill="#ffffff" stroke="#c9d1d9"/>
<text x="64" y="357" font-size="15" font-weight="600" fill="#1f2328">Lesson player</text>
<text x="64" y="377" font-size="13" fill="#59636e">Before/after slider, why-you cards</text>
<text x="64" y="394" font-size="13" fill="#59636e">Shop the step (CIEDE2000 &lt;= 5)</text>
<rect x="50" y="430" width="300" height="76" rx="10" fill="#ffffff" stroke="#c9d1d9"/>
<text x="64" y="457" font-size="15" font-weight="600" fill="#1f2328">MediaPipe Face Landmarker</text>
<text x="64" y="477" font-size="13" fill="#59636e">Runs in this tab (wasm from CDN)</text>
<text x="64" y="494" font-size="13" fill="#59636e">Per-region CIELAB means</text>
<rect x="50" y="530" width="300" height="76" rx="10" fill="#ffffff" stroke="#c9d1d9"/>
<text x="64" y="557" font-size="15" font-weight="600" fill="#1f2328">Share card</text>
<text x="64" y="577" font-size="13" fill="#59636e">Drawn on a canvas</text>
<text x="64" y="594" font-size="13" fill="#59636e">Never uploaded</text>
<rect x="500" y="130" width="300" height="76" rx="10" fill="#ffffff" stroke="#c9d1d9"/>
<text x="514" y="157" font-size="15" font-weight="600" fill="#1f2328">/api/analyze</text>
<text x="514" y="177" font-size="13" fill="#59636e">sharp: strip EXIF, re-encode</text>
<text x="514" y="194" font-size="13" fill="#59636e">Poll task, normalize result</text>
<rect x="500" y="230" width="300" height="76" rx="10" fill="#ffffff" stroke="#c9d1d9"/>
<text x="514" y="257" font-size="15" font-weight="600" fill="#1f2328">Rule table</text>
<text x="514" y="277" font-size="13" fill="#59636e">techniques.json + engine.ts</text>
<text x="514" y="294" font-size="13" fill="#59636e">Features -&gt; techniques + reasons</text>
<rect x="500" y="330" width="300" height="76" rx="10" fill="#ffffff" stroke="#c9d1d9"/>
<text x="514" y="357" font-size="15" font-weight="600" fill="#1f2328">/api/render</text>
<text x="514" y="377" font-size="13" fill="#59636e">Same file_id, one task per step</text>
<text x="514" y="394" font-size="13" fill="#59636e">LRU cache, TTL 2 h</text>
<rect x="500" y="430" width="300" height="76" rx="10" fill="#ffffff" stroke="#c9d1d9"/>
<text x="514" y="457" font-size="15" font-weight="600" fill="#1f2328">/api/grade</text>
<text x="514" y="477" font-size="13" fill="#59636e">CIEDE2000 vs answer image</text>
<text x="514" y="494" font-size="13" fill="#59636e">F6 fixed-box fallback</text>
<rect x="500" y="530" width="300" height="76" rx="10" fill="#ffffff" stroke="#c9d1d9" stroke-dasharray="5 4"/>
<text x="514" y="557" font-size="15" font-weight="600" fill="#1f2328">Unit guard</text>
<text x="514" y="577" font-size="13" fill="#59636e">Session cap 20 u, daily cap</text>
<text x="514" y="594" font-size="13" fill="#59636e">Demo mode when balance &lt; 150</text>
<rect x="940" y="120" width="320" height="296" rx="12" fill="#ffffff" stroke="#c8325b" stroke-width="1.5"/>
<text x="954" y="138" font-size="13" font-weight="700" fill="#c8325b">YouCam API (Perfect Corp)</text>
<rect x="950" y="150" width="300" height="68" rx="10" fill="#ffffff" stroke="#c9d1d9"/>
<text x="964" y="177" font-size="15" font-weight="600" fill="#1f2328">Face Attribute &amp; Ratio Analysis</text>
<text x="964" y="197" font-size="13" fill="#59636e">10 units, 5 features</text>
<rect x="950" y="336" width="300" height="68" rx="10" fill="#ffffff" stroke="#c9d1d9"/>
<text x="964" y="363" font-size="15" font-weight="600" fill="#1f2328">Makeup VTO</text>
<text x="964" y="383" font-size="13" fill="#59636e">1 unit per lesson step</text>
<rect x="950" y="430" width="300" height="76" rx="10" fill="#ffffff" stroke="#c9d1d9"/>
<text x="964" y="457" font-size="15" font-weight="600" fill="#1f2328">Claude (claude-opus-5-5)</text>
<text x="964" y="477" font-size="13" fill="#59636e">One-line corrections</text>
<text x="964" y="494" font-size="13" fill="#59636e">Gets Lab numbers, text only</text>
<text x="950" y="552" font-size="13" font-weight="700" fill="#1f2328">Stays on the device</text>
<text x="950" y="572" font-size="12" fill="#59636e">Landmark mesh, share card, profile</text>
<text x="950" y="596" font-size="13" font-weight="700" fill="#1f2328">Never stored server-side</text>
<text x="950" y="616" font-size="12" fill="#59636e">Photos live in memory only</text>
<line x1="350" y1="168" x2="500" y2="168" stroke="#c8325b" stroke-width="2" marker-end="url(#ap)"/>
<text x="425.0" y="160" font-size="12" text-anchor="middle" fill="#c8325b">selfie JPEG</text>
<line x1="800" y1="168" x2="950" y2="172" stroke="#c8325b" stroke-width="2" marker-end="url(#ap)"/>
<text x="875.0" y="160" font-size="12" text-anchor="middle" fill="#c8325b">EXIF-stripped</text>
<text x="875.0" y="184" font-size="12" text-anchor="middle" fill="#c8325b">image + task</text>
<line x1="500" y1="268" x2="350" y2="268" stroke="#59636e" stroke-width="2" marker-end="url(#ag)"/>
<text x="425.0" y="260" font-size="12" text-anchor="middle" fill="#59636e">profile</text>
<line x1="650" y1="206" x2="650" y2="230" stroke="#59636e" stroke-width="2" marker-end="url(#ag)"/>
<line x1="350" y1="356" x2="500" y2="356" stroke="#59636e" stroke-width="2" marker-end="url(#ag)"/>
<text x="425.0" y="348" font-size="12" text-anchor="middle" fill="#59636e">lesson effects</text>
<line x1="500" y1="384" x2="350" y2="384" stroke="#59636e" stroke-width="2" marker-end="url(#ag)"/>
<text x="425.0" y="400" font-size="12" text-anchor="middle" fill="#59636e">answer images</text>
<line x1="800" y1="374" x2="950" y2="374" stroke="#c8325b" stroke-width="2" marker-end="url(#ap)"/>
<text x="875.0" y="366" font-size="12" text-anchor="middle" fill="#c8325b">image + effects</text>
<line x1="350" y1="458" x2="500" y2="458" stroke="#59636e" stroke-width="2" marker-end="url(#ag)"/>
<text x="425.0" y="450" font-size="12" text-anchor="middle" fill="#59636e">Lab means + photos</text>

<line x1="800" y1="468" x2="950" y2="468" stroke="#59636e" stroke-width="2" marker-end="url(#ag)"/>
<text x="875.0" y="460" font-size="12" text-anchor="middle" fill="#59636e">numbers only</text>
<line x1="500" y1="486" x2="350" y2="486" stroke="#59636e" stroke-width="2" marker-end="url(#ag)"/>
<text x="425.0" y="506" font-size="12" text-anchor="middle" fill="#59636e">scores + tips</text>
<text x="425.0" y="576" font-size="12" text-anchor="middle" fill="#59636e">caps units</text>
<text x="640" y="708" font-size="12" text-anchor="middle" fill="#59636e">Arrows to YouCam are pink (images leave the device and our server). YouCam keeps uploaded files up to 30 days; the consent screen says so.</text>
</svg>